spring.application.name=api-caich

# ===============================
# SERVER CONFIG
# ===============================
server.servlet.context-path=/api
server.port=8080
spring.mvc.content-negotiation.favor-parameter=false
spring.mvc.content-negotiation.favor-path-extension=false

# ===============================
# DATASOURCE CONFIG
# ===============================
# Agregamos ;trustServerCertificate=true para evitar errores de SSL con Docker
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=CaichDB;encrypt=false;trustServerCertificate=true

# IMPORTANTE: Usamos el usuario que creamos en el init.sql (buenas prácticas)
# Aunque 'sa' funciona, es mejor verificar que tu script de usuarios funcionó.
spring.datasource.username=myuser
spring.datasource.password=UserP@ssw0rd!

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# JPA / HIBERNATE CONFIG
# ===============================
# IMPORTANTE: Descomenta esto para que Hibernate cree las tablas automáticamente
# ya que la BD en Docker está vacía actualmente.
spring.jpa.hibernate.ddl-auto=update


# ===============================
# JPA / HIBERNATE CONFIG
# ===============================
# spring.jpa.hibernate.ddl-auto=create
# spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.show-sql=true

# Opcional: Para SQL Server 2022, suele ser mejor usar el dialecto más reciente o el genérico
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2016Dialect

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===============================
# JACKSON CONFIG
# ===============================
spring.jackson.time-zone=America/Mexico_City
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ===============================
# APP CONFIG (JWT)
# ===============================
app.jwt.secret=caichJwtSecretKey2025SecureAndLongEnoughForSecurity
app.jwt.expiration=86400000
#7 days in milliseconds
app.jwt.refresh-expiration=604800000

# ===============================
# SPRINGDOC / SWAGGER CONFIG
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true

# ===============================
# LOGGING CONFIG
# ===============================
logging.level.com.caich=DEBUG
logging.level.org.springframework.web: INFO
logging.level.org.springframework.security: INFO
# logging.level.org.hibernate.SQL: WARN

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %highlight(%-5level) - %cyan([%thread]) - %green(%logger{36}) - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %-5level - [%thread] - %logger{36} - %msg%n

# ===============================
# APPLICATION INFO
# ===============================
app.name=API CAICH
app.version=1.0.0
app.environment=development
app.file.upload-dir=D:/Documentos/CaichAPP/caich-app/src/assets/
app.file.max-size=5242880

info.app.name=${app.name}
info.app.version=${app.version}
info.app.environment=${app.environment}

# ===============================
# ERROR DETAILS (DEBUG MODE)
# ===============================
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-binding-errors=always