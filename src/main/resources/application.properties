spring.application.name=api-caich

# ===============================
# SERVER CONFIG
# ===============================
server.servlet.context-path=/api
server.port=8080
spring.mvc.content-negotiation.favor-parameter=false
spring.mvc.content-negotiation.favor-path-extension=false

# ===============================
# DATASOURCE CONFIG
# ===============================
# Agregamos ;trustServerCertificate=true para evitar errores de SSL con Docker
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=CaichDB;encrypt=false;trustServerCertificate=true

# IMPORTANTE: Usamos el usuario que creamos en el init.sql (buenas prcticas)
# Aunque 'sa' funciona, es mejor verificar que tu script de usuarios funcion.
spring.datasource.username=myuser
spring.datasource.password=UserP@ssw0rd!

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# JPA / HIBERNATE CONFIG
# ===============================
# ddl-auto: Hibernate actualiza/crea tablas automaticamente basado en @Entity
spring.jpa.hibernate.ddl-auto=create
# Muestra las queries en la consola (util para verificar actualizaciones de BD)
spring.jpa.show-sql=true
# Formatea el SQL para que sea legible
#spring.jpa.properties.hibernate.format_sql=true
# Muestra los valores de los parÃÂ¡metros en las queries
#logging.level.org.hibernate.orm.jdbc.bind=debug
# Dialecto para SQL Server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2016Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===============================
# JACKSON CONFIG
# ===============================
spring.jackson.time-zone=America/Mexico_City
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
# Esto hace que Jackson acepte props sin importar si son mayusculas o minusculas
spring.jackson.mapper.accept-case-insensitive-properties=true

# ===============================
# FILE UPLOAD CONFIG
# ===============================
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# APP CONFIG (JWT)
# ===============================
app.jwt.secret=caichJwtSecretKey2025SecureAndLongEnoughForSecurity
app.jwt.expiration=86400000
#7 days in milliseconds
app.jwt.refresh-expiration=604800000

# ===============================
# SPRINGDOC / SWAGGER CONFIG
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true

# ===============================
# LOGGING CONFIG
# ===============================
logging.level.com.caich=DEBUG
logging.level.org.springframework.web: INFO
logging.level.org.springframework.security: INFO
# logging.level.org.hibernate.SQL: WARN

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %highlight(%-5level) - %cyan([%thread]) - %green(%logger{36}) - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %-5level - [%thread] - %logger{36} - %msg%n

# ===============================
# APPLICATION INFO
# ===============================
app.name=API CAICH
app.version=1.0.0
app.environment=development
app.file.upload-dir=D:/Documentos/CaichAPP/caich-app/src/assets/
app.file.max-size=5242880

info.app.name=${app.name}
info.app.version=${app.version}
info.app.environment=${app.environment}

# ===============================
# ERROR DETAILS (DEBUG MODE)
# ===============================
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-binding-errors=always


# ===============================
# GOOGLE FORMS SYNC CONFIG
# ===============================
# Coloca aqui el link de la hoja de calculo publicada como CSV
app.sync.google-forms-url=https://docs.google.com/spreadsheets/d/e/2PACX-1vSUMkp573GfS8BUIxLvOLWyJM85YyIBEN0Ev5-Ic2tbJBZmbRb7Kn9Bl8eBoFwALLFeTb3h32RwGIlC/pub?output=csv

