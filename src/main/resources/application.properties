# Ruta al archivo JSON de credenciales de Service Account
# Si estÃÂ¡ vacÃÂ­o, intentarÃÂ¡ descarga pÃÂºblica (requiere archivos pÃÂºblicos)
google.drive.credentials.path=D:/Documentos/CaichAPP/caich-app/caich-drive-credentials.json
