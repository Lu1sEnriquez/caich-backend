spring.application.name=api-caich

# ===============================
# SERVER CONFIG
# ===============================
server.servlet.context-path=/api
server.port=8080
spring.mvc.content-negotiation.favor-parameter=false
spring.mvc.content-negotiation.favor-path-extension=false

# ===============================
# DATASOURCE CONFIG
# ===============================
# Configuración por defecto para SQL Server local/Docker
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=CaichDB;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:UserP@ssw0rd!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# JPA / HIBERNATE CONFIG
# ===============================
# update crea las tablas faltantes y conserva la información existente
spring.jpa.hibernate.ddl-auto=update
# Muestra las queries en la consola (útil para verificar actualizaciones de BD)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Muestra los valores de los parámetros en las queries
# logging.level.org.hibernate.orm.jdbc.bind=debug
# Dialecto y esquema por defecto para SQL Server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.default_schema=CAICH
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City
spring.sql.init.mode=always
# Preserva exactamente los nombres definidos en las entidades cuando sea necesario
# spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===============================
# JACKSON CONFIG
# ===============================
spring.jackson.time-zone=America/Mexico_City
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
# Esto hace que Jackson acepte props sin importar si son mayusculas o minusculas
spring.jackson.mapper.accept-case-insensitive-properties=true

# ===============================
# FILE UPLOAD CONFIG
# ===============================
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# APP CONFIG (JWT)
# ===============================
app.jwt.secret=${JWT_SECRET:caichJwtSecretKey2025SecureAndLongEnoughForSecurity}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
#7 days in milliseconds
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ===============================
# SPRINGDOC / SWAGGER CONFIG
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true

# ===============================
# LOGGING CONFIG
# ===============================
logging.level.com.caich=DEBUG
logging.level.org.springframework.web: INFO
logging.level.org.springframework.security: INFO
logging.level.org.hibernate.SQL: DEBUG
logging.level.org.hibernate.orm.jdbc.bind: TRACE

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %highlight(%-5level) - %cyan([%thread]) - %green(%logger{36}) - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %-5level - [%thread] - %logger{36} - %msg%n

# ===============================
# APPLICATION INFO
# ===============================
app.name=API CAICH
app.version=1.0.0
app.environment=${APP_ENVIRONMENT:development}
app.file.upload-dir=${FILE_UPLOAD_DIR:./uploads/}
app.file.max-size=5242880
# Datos mínimos por defecto: usuarios, productos, cubículos y horarios.
# Los tickets y escenarios demo solo se cargan con app.seed.demo=true.
app.seed.demo=${SEED_DEMO:false}

info.app.name=${app.name}
info.app.version=${app.version}
info.app.environment=${app.environment}

# ===============================
# ERROR DETAILS (DEBUG MODE)
# ===============================
server.error.include-message=${ERROR_INCLUDE_MESSAGE:always}
server.error.include-stacktrace=${ERROR_INCLUDE_STACKTRACE:on_param}
server.error.include-binding-errors=${ERROR_INCLUDE_BINDING_ERRORS:always}


# ===============================
# GOOGLE FORMS SYNC CONFIG
# ===============================
# Coloca aqui el link de la hoja de calculo publicada como CSV
app.sync.google-forms-url=https://docs.google.com/spreadsheets/d/e/2PACX-1vSUMkp573GfS8BUIxLvOLWyJM85YyIBEN0Ev5-Ic2tbJBZmbRb7Kn9Bl8eBoFwALLFeTb3h32RwGIlC/pub?output=csv

