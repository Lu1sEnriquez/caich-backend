spring.datasource.url=jdbc:h2:mem:caichdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=PUBLIC
spring.sql.init.mode=never
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City

app.jwt.secret=caichJwtSecretKey2025SecureAndLongEnoughForSecurity
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000
