# ===============================
# EJEMPLO: application-template.properties
# ===============================
# Copia este archivo como application.properties y configura las variables de entorno
# o reemplaza los valores ${...} con tus valores reales.
# 
# NUNCA subas application.properties con credenciales reales a Git.
# Agrega application.properties a tu .gitignore

spring.application.name=api-caich

# ===============================
# SERVER CONFIG
# ===============================
server.servlet.context-path=/caich-api
server.port=${SERVER_PORT:8080}
spring.mvc.content-negotiation.favor-parameter=false
spring.mvc.content-negotiation.favor-path-extension=false

# ===============================
# DATASOURCE CONFIG
# ===============================
# Usa variables de entorno para credenciales sensibles

# --- SQL Server ---
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=CaichDB;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:UserP@ssw0rd!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===============================
# JPA / HIBERNATE CONFIG
# ===============================
# spring.jpa.hibernate.ddl-auto=create
# spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.show-sql=true
# --- SQL Server ---
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===============================
# JACKSON CONFIG
# ===============================
spring.jackson.time-zone=America/Mexico_City
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ===============================
# APP CONFIG (JWT)
# ===============================
# IMPORTANTE: Usa variables de entorno en producción
# NO uses el valor por defecto en producción
app.jwt.secret=${JWT_SECRET:caichJwtSecretKey2025SecureAndLongEnoughForSecurity}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
# 7 days in milliseconds
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ===============================
# SPRINGDOC / SWAGGER CONFIG
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true

# ===============================
# LOGGING CONFIG
# ===============================
logging.level.com.caich=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
# logging.level.org.hibernate.SQL=WARN

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %highlight(%-5level) - %cyan([%thread]) - %green(%logger{36}) - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %-5level - [%thread] - %logger{36} - %msg%n

# ===============================
# APPLICATION INFO
# ===============================
app.name=API CAICH
app.version=1.0.0
app.environment=${APP_ENVIRONMENT:development}
app.file.upload-dir=${FILE_UPLOAD_DIR:./uploads/profiles/}
app.file.max-size=5242880

info.app.name=${app.name}
info.app.version=${app.version}
info.app.environment=${app.environment}

# ===============================
# ERROR DETAILS (DEBUG MODE)
# ===============================
# En producción, cambia estos valores a 'never' o 'on_param'
server.error.include-message=${ERROR_INCLUDE_MESSAGE:always}
server.error.include-stacktrace=${ERROR_INCLUDE_STACKTRACE:on_param}
server.error.include-binding-errors=${ERROR_INCLUDE_BINDING_ERRORS:always}
