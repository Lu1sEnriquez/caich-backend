services:
  database:
    build:
      context: ./docker/mssql
      dockerfile: Dockerfile
    container_name: sqlserver_caich
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=UserP@ssw0rd!
    ports:
      - "1438:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'UserP@ssw0rd!' -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sqlserver_data:
